@keyframes sunIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes fadeOut{to{opacity:0;transform:scale(1.25)}}
@keyframes pawIn{to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pulse,.sun,.paw,.word{animation:none}.pulse{stroke-dashoffset:0}.word,.paw{opacity:1;transform:none}}
