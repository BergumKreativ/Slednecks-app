<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 420" role="img" aria-label="SagaTrail"><style>
.pulse{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.6,0,.3,1) .15s forwards}
.sun{transform-box:fill-box;transform-origin:center;opacity:0;animation:sunIn .35s ease-out 1.05s forwards,fadeOut .3s ease-in 1.75s forwards}
.paw{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.3);animation:pawIn .45s cubic-bezier(.3,1.6,.5,1) 1.85s forwards}
.word{opacity:0;animation:fadeIn .7s ease .55s forwards}
